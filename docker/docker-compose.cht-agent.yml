# docker-compose.cht-agent.yml (#114)
#
# Runs the sandboxed cht-agent on the shared `cht-agent-net` Docker network,
# alongside a CHT instance the HUMAN operator brings up (the agent never runs
# Docker). The #66 override (docker/cht-agent-net.override.yml) attaches the
# CHT stack's nginx to the same network so the agent reaches it at
# https://nginx. Full walkthrough: docs/docker-agent-runbook.md.
#
#   docker network create cht-agent-net    # once
#   CHT_CORE_PATH=$HOME/src/cht-core \
#     docker compose -f docker/docker-compose.cht-agent.yml up -d --build
#
# Security invariants (do not "fix" these):
#   - NO Docker socket mount. A mounted socket grants host-root; env bring-up
#     is human-gated instead.
#   - NO SSH keys, host ~/.gitconfig, or write tokens enter the container.
#   - Model credentials are mounted READ-ONLY.
#   - The working copy's .git/config is shadowed by a hardened read-only file,
#     so the agent cannot edit remotes or undo the push block.

networks:
  cht-agent-net:
    external: true

services:
  cht-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: cht-agent:local
    container_name: cht-agent
    hostname: cht-agent
    stdin_open: true
    tty: true
    # Operator-gated: a sandbox-verification failure (init-agent-git.sh exits
    # non-zero) must stay DOWN for inspection, not crash-loop. The operator
    # explicitly brings the agent up per session.
    restart: "no"
    # Confinement hardening: the agent never needs extra privileges.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - cht-agent-net
    environment:
      # Model credentials: runtime auth is the read-only .credentials.json
      # mount below (claude-code OAuth). ANTHROPIC_API_KEY stays as an optional
      # fallback for API-key-based runs; leave it unset when using OAuth.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHT_CORE_PATH: /workspace/cht-core
      # Deployment config repo (layer: cht-conf tickets are developed HERE,
      # never in cht-core) and the canonical baseline it is diffed against
      # (#134). CANONICAL_CONF must be a path visible INSIDE the container —
      # the default is cht-core's standard config from the mount above.
      CHT_CONF_PATH: /workspace/cht-conf-project
      CANONICAL_CONF: ${CANONICAL_CONF:-/workspace/cht-core/config/standard}
      # CHT entry point on cht-agent-net (nginx joins via the #66 override)
      CHT_URL: ${CHT_URL:-https://nginx}
      NODE_ENV: development
      # --openssl-legacy-provider: deployment-pinned cht-conf (3.21.4) compiles
      # app_settings with webpack 4, whose MD4 hashing OpenSSL 3 (Node 17+)
      # removed — without it, compile-app-settings dies with
      # ERR_OSSL_EVP_UNSUPPORTED. Needed by the agent's app-settings bucket
      # (cht-conf-runner) and manual 2b execs alike; max-old-space mirrors the
      # image ENV this block overrides.
      NODE_OPTIONS: "--max-old-space-size=4096 --openssl-legacy-provider"
      # --- Demo closed loop (docs/handoffs/demo-runbook.md step 3) ---
      # CLI provider: the agent drives the baked Claude Code CLI (`claude -p`)
      # via the OAuth mount below — no API key. Default 'anthropic' needs one.
      LLM_PROVIDER: ${LLM_PROVIDER:-claude-cli}
      # Read by the `claude` binary itself — the CLI provider passes no
      # --model flag (src/llm/providers/claude-cli.ts). Pinned off Fable so
      # demo runs don't burn the session budget.
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      # Version parity (#66): QA cht-conf calls run the deployment-pinned
      # binary that the config repo's own `npm ci` installed into the mount
      # above — never the image-global cht.
      CHT_CONF_BIN: ${CHT_CONF_BIN:-/workspace/cht-conf-project/node_modules/.bin/cht}
      # TLS trust for the agent's own fetch (readiness poll, discoverConfig,
      # verifyArtifact — cht-conf has its own --accept-self-signed-certs).
      # Self-signed test instance: NODE_TLS_REJECT_UNAUTHORIZED=0. Local-CA
      # cert: prefer NODE_EXTRA_CA_CERTS + the :ro cert mount stub below
      # (keeps verification on).
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      # QA auth to the throwaway instance — must match step 1's .env. Embedded
      # CHT_URL credentials would win over these (test-environment-agent.ts).
      COUCHDB_USER: ${COUCHDB_USER:-medic}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-password}
      # QA seed data (runbook 2b): leave EMPTY to skip seeding (tier-1 verify
      # is content-only). To seed in-container, generate with
      # `npm run demo:build-seed -- ... --out /workspace/test-data` and set
      # this to /workspace/test-data (agent-owned; mount it only if you want
      # to inspect the CSVs from the host).
      CHT_TEST_DATA_PATH: ${CHT_TEST_DATA_PATH:-}
      # Langfuse tracing is ON unless this is literally "false"
      # (src/observability/index.ts) — keyless runs spam SDK warnings, so
      # default off; set the keys + true to opt in.
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      # The cht-core working copy is an INPUT: a standing local clone the agent
      # local-branches and edits in place. Must be a full clone (a .git
      # DIRECTORY — worktrees have a .git file and the shadow mount below fails).
      - ${CHT_CORE_PATH:?Set CHT_CORE_PATH to your cht-core working copy}:/workspace/cht-core:rw
      # Hardened git config shadows the working copy's own .git/config.
      - ${CHT_CORE_GIT_CONFIG:-./git-config.hardened}:/workspace/cht-core/.git/config:ro
      # Deployment cht-conf project (#134): the config repo the agent researches
      # (canonical diff) and, for layer: cht-conf tickets, develops in. Writable
      # by design — the dev/qa gate routes config work here, never into cht-core.
      # Defaults to the committed placeholder so core-only sessions need no setup;
      # point CHT_CONF_PATH at a real config working copy for cht-conf tickets.
      - ${CHT_CONF_PATH:-./conf-placeholder}:/workspace/cht-conf-project:rw
      # Model credentials, read-only. ACTIVE since #134: the image bakes the
      # Claude Code CLI (docker/Dockerfile) and this mount is its OAuth auth —
      # the runtime path, replacing ANTHROPIC_API_KEY (kept only as a fallback).
      # The seeding pipeline still authenticates via its own named volume
      # (docker-compose.seeder.yml), not this bind.
      # The file MUST exist as a regular file before `up` (run bootstrap-workspace.sh,
      # which touches it) — otherwise Docker creates a root-owned directory at the
      # target. Compose does NOT expand `~`, so the default uses ${HOME}; set
      # CLAUDE_CREDENTIALS to an absolute path to override. NOTE: whatever is mounted
      # here is fully readable by the agent's shell — use disposable, narrowly-scoped
      # credentials, never your personal OAuth credentials (see docs/docker-agent-runbook.md).
      - ${CLAUDE_CREDENTIALS:-${HOME}/.claude/.credentials.json}:/home/agent/.claude/.credentials.json:ro
      # Local-CA trust for the agent's fetch (pair with NODE_EXTRA_CA_CERTS
      # above, e.g. NODE_EXTRA_CA_CERTS=/workspace/local-ca.crt). Uncomment and
      # point LOCAL_CA_CERT at the CA file the test instance's nginx presents:
      # - ${LOCAL_CA_CERT:?Set LOCAL_CA_CERT to the local CA certificate}:/workspace/local-ca.crt:ro
    deploy:
      resources:
        limits:
          memory: ${AGENT_MEMORY_LIMIT:-4g}
          cpus: "${AGENT_CPU_LIMIT:-2}"
