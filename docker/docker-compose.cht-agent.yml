# docker-compose.cht-agent.yml (#114)
#
# Runs the sandboxed cht-agent on the shared `cht-agent-net` Docker network,
# alongside a CHT instance the HUMAN operator brings up (the agent never runs
# Docker). The #66 override (docker/cht-agent-net.override.yml) attaches the
# CHT stack's nginx to the same network so the agent reaches it at
# https://nginx. Full walkthrough: docs/docker-agent-runbook.md.
#
#   docker network create cht-agent-net    # once
#   CHT_CORE_PATH=$HOME/src/cht-core \
#     docker compose -f docker/docker-compose.cht-agent.yml up -d --build
#
# Security invariants (do not "fix" these):
#   - NO Docker socket mount. A mounted socket grants host-root; env bring-up
#     is human-gated instead.
#   - NO SSH keys, host ~/.gitconfig, or write tokens enter the container.
#   - Model credentials never come from the host filesystem. They live in the
#     agent-claude-config named volume (minted in-container by a one-time
#     `/login`), or arrive as CLAUDE_CODE_OAUTH_TOKEN. The old read-only
#     ~/.claude/.credentials.json bind is still available, commented out below,
#     for operators who prefer supplying them from outside.
#   - The working copy's .git/config is shadowed by a hardened read-only file,
#     so the agent cannot edit remotes or undo the push block.

networks:
  cht-agent-net:
    external: true

services:
  cht-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: cht-agent:local
    container_name: cht-agent
    hostname: cht-agent
    stdin_open: true
    tty: true
    # Operator-gated: a sandbox-verification failure (init-agent-git.sh exits
    # non-zero) must stay DOWN for inspection, not crash-loop. The operator
    # explicitly brings the agent up per session.
    restart: "no"
    # Confinement hardening: the agent never needs extra privileges.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - cht-agent-net
    environment:
      # Model credentials: runtime auth is the one-time `/login` persisted in the
      # agent-claude-config volume (see the volumes block). ANTHROPIC_API_KEY
      # stays as an optional fallback for API-key-based runs; leave it unset
      # when using OAuth.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Headless OAuth, for runs where no one can complete an interactive
      # `/login` (CI, cron, a fresh volume). Mint it outside with
      # `claude setup-token`. Takes effect without touching the volume, so it
      # also works when agent-claude-config is empty.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CHT_CORE_PATH: /workspace/cht-core
      # Deployment config repo (layer: cht-conf tickets are developed HERE,
      # never in cht-core) and the canonical baseline it is diffed against
      # (#134). CANONICAL_CONF must be a path visible INSIDE the container —
      # the default is cht-core's standard config from the mount above.
      CHT_CONF_PATH: /workspace/cht-conf-project
      CANONICAL_CONF: ${CANONICAL_CONF:-/workspace/cht-core/config/standard}
      # CHT entry point on cht-agent-net (nginx joins via the #66 override)
      CHT_URL: ${CHT_URL:-https://nginx}
      NODE_ENV: development
      # --openssl-legacy-provider: deployment-pinned cht-conf (3.21.4) compiles
      # app_settings with webpack 4, whose MD4 hashing OpenSSL 3 (Node 17+)
      # removed — without it, compile-app-settings dies with
      # ERR_OSSL_EVP_UNSUPPORTED. Needed by the agent's app-settings bucket
      # (cht-conf-runner) and manual 2b execs alike; max-old-space mirrors the
      # image ENV this block overrides.
      NODE_OPTIONS: "--max-old-space-size=4096 --openssl-legacy-provider"
      # --- Demo closed loop (docs/handoffs/demo-runbook.md step 3) ---
      # Development refinement-loop iteration budget (development-supervisor
      # MAX_ITERATIONS). Parsed as an int, clamped 1–10; leave empty for the
      # default (3). Raise it when a fix legitimately needs more descriptor
      # retries; a non-default value is logged at run start.
      DEV_MAX_ITERATIONS: ${DEV_MAX_ITERATIONS:-5}
      # Test-gen verification: prove generated specs red→green in a sandbox
      # before they ship (docs/handoffs/test-gen-verification-plan.md), with a
      # bounded fixture-repair loop. Opt-in — two harness boots (+ offline
      # compiles for settings artifacts) per attempt is real wall-clock.
      TEST_GEN_VERIFY: ${TEST_GEN_VERIFY:-}
      TEST_GEN_MAX_REPAIRS: ${TEST_GEN_MAX_REPAIRS:-}
      # CLI provider: the agent drives the baked Claude Code CLI (`claude -p`)
      # via the OAuth mount below — no API key. Default 'anthropic' needs one.
      LLM_PROVIDER: ${LLM_PROVIDER:-claude-cli}
      # Read by the `claude` binary itself — the CLI provider passes no
      # --model flag (src/llm/providers/claude-cli.ts). Pinned off Fable so
      # demo runs don't burn the session budget.
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      # Reasoning effort for every `claude -p` the pipeline spawns. Same
      # mechanism as ANTHROPIC_MODEL above: the CLI provider forwards
      # process.env to the claude binary (env: { ...process.env } in
      # src/llm/providers/claude-cli.ts), and these env vars outrank
      # settings.json — only --model/--effort flags rank higher. "max" is
      # env/flag-only; settings.json effortLevel cannot express it. Mirrors
      # SEEDER_EFFORT in docker-compose.seeder.yml. Left EMPTY by default so the
      # CLI's own default applies: raising effort raises latency and burns the
      # subscription budget, and a demo run already spends minutes per phase.
      CLAUDE_CODE_EFFORT_LEVEL: ${CLAUDE_CODE_EFFORT_LEVEL:-max}
      # Version parity (#66): QA cht-conf calls run the deployment-pinned
      # binary that the config repo's own `npm ci` installed into the mount
      # above — never the image-global cht.
      CHT_CONF_BIN: ${CHT_CONF_BIN:-/workspace/cht-conf-project/node_modules/.bin/cht}
      # TLS trust for the agent's own fetch (readiness poll, discoverConfig,
      # verifyArtifact — cht-conf has its own --accept-self-signed-certs, which
      # is why only the agent's fetch fails, and with a bare "fetch failed").
      #
      # DEFAULTS TO 0 because the test instance nginx serves a SELF-SIGNED cert:
      # Node's fetch rejects it exactly as plain `curl` does (`curl -k` works,
      # the agent does not), and the readiness poll then burns its full 300s
      # before aborting the QA phase. This previously defaulted to empty and had
      # to be exported in the host shell before `up`; that does not survive a new
      # terminal, so it silently regressed on every rebuild.
      #
      # Scope of the trade-off: this disables TLS verification for the agent's
      # own HTTP inside a sandboxed container that only ever talks to a
      # throwaway test instance on cht-agent-net. If this container is ever
      # pointed at something real, set NODE_TLS_REJECT_UNAUTHORIZED=1 in the
      # host env (it overrides this default) and use NODE_EXTRA_CA_CERTS with
      # the :ro cert mount stub below, which keeps verification ON.
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-0}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      # QA auth to the throwaway instance — must match step 1's .env. Embedded
      # CHT_URL credentials would win over these (test-environment-agent.ts).
      COUCHDB_USER: ${COUCHDB_USER:-medic}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-password}
      # QA seed data (runbook 2b): leave EMPTY to skip seeding (tier-1 verify
      # is content-only). To seed in-container, generate with
      # `npm run demo:build-seed -- ... --out /workspace/test-data` and set
      # this to /workspace/test-data (agent-owned; mount it only if you want
      # to inspect the CSVs from the host).
      CHT_TEST_DATA_PATH: ${CHT_TEST_DATA_PATH:-}
      # Langfuse tracing is ON unless this is literally "false"
      # (src/observability/index.ts) — keyless runs spam SDK warnings, so
      # default off; set the keys + true to opt in.
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      # The cht-core working copy is an INPUT: a standing local clone the agent
      # local-branches and edits in place. Must be a full clone (a .git
      # DIRECTORY — worktrees have a .git file and the shadow mount below fails).
      - ${CHT_CORE_PATH:?Set CHT_CORE_PATH to your cht-core working copy}:/workspace/cht-core:rw
      # Hardened git config shadows the working copy's own .git/config.
      - ${CHT_CORE_GIT_CONFIG:-./git-config.hardened}:/workspace/cht-core/.git/config:ro
      # Deployment cht-conf project (#134): the config repo the agent researches
      # (canonical diff) and, for layer: cht-conf tickets, develops in. Writable
      # by design — the dev/qa gate routes config work here, never into cht-core.
      # Defaults to the committed placeholder so core-only sessions need no setup;
      # point CHT_CONF_PATH at a real config working copy for cht-conf tickets.
      - ${CHT_CONF_PATH:-./conf-placeholder}:/workspace/cht-conf-project:rw
      # Claude CLI OAuth credentials persist here — log in ONCE via:
      #   docker exec -it cht-agent claude     # then /login
      # (named volume is seeded from the image's baked CLAUDE.md/settings.json,
      # mirroring docker-compose.seeder.yml's seeder-claude-config)
      #
      # Why a volume and not the old read-only .credentials.json bind: `/login`
      # persists to that file, so a read-only bind made the login succeed in the
      # interactive process and vanish for every `claude -p` after it. The login
      # appeared to persist only because the REST of /home/agent/.claude was the
      # container's writable layer — which `up -d` discards on recreate, so the
      # first rebuild lost it.
      #
      # Trade-off, stated plainly: credentials are now MINTED inside the
      # container and stored in a Docker volume, rather than supplied read-only
      # from outside. Anything running in the container can use them. To keep the
      # supply-from-outside posture instead, comment this volume out and restore
      # the bind below, or set CLAUDE_CODE_OAUTH_TOKEN (above) and use neither.
      - agent-claude-config:/home/agent/.claude
      # Opt-in alternative to the volume above: supply credentials read-only from
      # the host. `/login` cannot persist against this — mint them elsewhere (a
      # disposable, narrowly-scoped account) and point CLAUDE_CREDENTIALS at the
      # file. The file MUST exist as a regular file before `up` (bootstrap-workspace.sh
      # touches it) or Docker creates a root-owned directory at the target.
      # Compose does NOT expand `~`, so the default uses ${HOME}.
      # - ${CLAUDE_CREDENTIALS:-${HOME}/.claude/.credentials.json}:/home/agent/.claude/.credentials.json:ro
      # Local-CA trust for the agent's fetch (pair with NODE_EXTRA_CA_CERTS
      # above, e.g. NODE_EXTRA_CA_CERTS=/workspace/local-ca.crt). Uncomment and
      # point LOCAL_CA_CERT at the CA file the test instance's nginx presents:
      # - ${LOCAL_CA_CERT:?Set LOCAL_CA_CERT to the local CA certificate}:/workspace/local-ca.crt:ro
    deploy:
      resources:
        limits:
          memory: ${AGENT_MEMORY_LIMIT:-4g}
          cpus: "${AGENT_CPU_LIMIT:-2}"

volumes:
  # Claude CLI OAuth credentials + baked CLAUDE.md/settings.json. Survives
  # `up -d` recreates and image rebuilds, so the one-time login sticks.
  # Note: Docker seeds a named volume from the image ONLY when the volume is
  # first created, so a later image that changes the baked CLAUDE.md/settings.json
  # will NOT refresh it. To pick those up, remove the volume and log in again:
  #   docker compose -f docker/docker-compose.cht-agent.yml down
  #   docker volume rm docker_agent-claude-config   # `docker volume ls | grep agent-claude-config` if the project name differs
  # Same caveat as seeder-claude-config.
  agent-claude-config:
