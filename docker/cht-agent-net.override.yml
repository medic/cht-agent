# cht-agent-net.override.yml
#
# Layers onto cht-core's local-build compose (or the docker-helper stack) so the
# running CHT instance joins the shared `cht-agent-net` network that the
# dockerized cht-agent is also attached to. This lets the agent reach the
# instance at https://nginx with no host-port juggling and — importantly — with
# NO Docker access (the agent only polls /api/v2/monitoring).
#
# HUMAN-run only (the cht-agent never runs Docker). scripts/test-env-up.sh applies
# it with a per-checkout project, internal network and data dir (scripts/lib/test-env.sh);
# by hand, pass the same values that test_env_compose passes, not only -p. Without
# CHT_NETWORK, the stack shares the default `cht-net` network and the couchdb/haproxy/api
# names with any other CHT stack that also uses `cht-net`. Without COUCHDB_PASSWORD,
# Compose stops. Use this command:
#   COUCHDB_USER=medic COUCHDB_PASSWORD=password COMMON_NAME=nginx \
#   NGINX_HTTP_PORT=127.0.0.1:80 NGINX_HTTPS_PORT=127.0.0.1:443 \
#   CHT_NETWORK=<project>-net COUCHDB_DATA=./srv-<project> \
#     docker compose -p <project> -f cht-couchdb.yml -f cht-core.yml -f cht-agent-net.override.yml up -d
# Only one stack's nginx can be on cht-agent-net at a time: `nginx` would resolve to both.
#
# VALIDATE before relying on this: the service name (`nginx`) and the key of the
# stack's internal network (`cht-net` below; CHT_NETWORK sets its actual name) must
# match what `npm run local-images` generates in `local-build/` for your cht-core
# version. Confirm with:
#   docker compose ... config            # see resolved service/network names
#   docker network inspect cht-agent-net # confirm nginx is attached
# If the internal network differs, update the first entry under nginx.networks.

networks:
  cht-agent-net:
    external: true

services:
  # nginx is the HTTPS entry point the agent reaches. Keep it on the stack's
  # internal network AND join the shared cht-agent-net.
  nginx:
    networks:
      - cht-net
      - cht-agent-net
