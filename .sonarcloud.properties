sonar.sources=.
# Can have multiple comma-separated entries.
# docker/** is vendored from #114 (sandbox base image) so the seeder builds
# standalone; it's analyzed on the #114 PR and removed here once #114 merges.
sonar.exclusions=test/**/*,docker/**

sonar.tests=.
# Can have multiple comma-separated entries
sonar.test.inclusions=test/**/*

sonar.issue.ignore.block=e1
sonar.issue.ignore.block.e1.beginBlockRegexp=NOSONAR_BEGIN
sonar.issue.ignore.block.e1.endBlockRegexp=NOSONAR_END
